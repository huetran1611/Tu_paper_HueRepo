name: Big instance heavy/light - Dd 2.27

on:
  workflow_dispatch:
    inputs:
      time_limit_sec:
        description: "Per solver process time limit in seconds"
        required: true
        default: "7200"
      max_parallel:
        description: "Maximum parallel GitHub jobs"
        required: true
        default: "250"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Build solver and prepare 250 balanced jobs
    runs-on: ubuntu-latest
    outputs:
      experiment_matrix: ${{ steps.matrix.outputs.matrix }}
      task_count: ${{ steps.matrix.outputs.task_count }}
      job_count: ${{ steps.matrix.outputs.job_count }}
    steps:
      - uses: actions/checkout@v5

      - name: Build time-dependent solver with Dd=2.27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/big_instance_dd227
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          src = Path("tabubu_TimeDependent.cpp")
          dst = Path("build/big_instance_dd227/tabubu_TimeDependent_Dd227.cpp")
          text = src.read_text(encoding="utf-8")
          text = re.sub(
              r"^double Dd = [^,;]+,\s*E = ([^;]+);",
              r"double Dd = 2.27, E = \1;",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          dst.write_text(text, encoding="utf-8")
          PYEOF
          grep -E "^double Dd =" build/big_instance_dd227/tabubu_TimeDependent_Dd227.cpp
          g++ -O2 -std=c++20 \
            build/big_instance_dd227/tabubu_TimeDependent_Dd227.cpp \
            -o build/big_instance_dd227/tabubu_big_instance_dd227

      - name: Generate 192 tasks distributed across 250 one-process jobs
        id: matrix
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os
          from pathlib import Path

          scenarios = ["light", "heavy"]
          scenario_roots = {name: Path("big_instance") / name for name in scenarios}
          instances = []

          for scenario, root in scenario_roots.items():
              for path in sorted(glob.glob(str(root / "*.txt"))):
                  name = Path(path).name
                  if name.endswith(".vmax_ij.txt") or name.endswith(".theta_ijl.txt"):
                      continue
                  base = name.removesuffix(".txt")
                  parts = base.split(".")
                  if len(parts) != 3:
                      continue
                  customer_count = int(parts[0])
                  required = [
                      root / f"{base}.txt",
                      root / f"{base}.vmax_ij.txt",
                      root / f"{base}.theta_ijl.txt",
                  ]
                  missing = [str(p) for p in required if not p.exists()]
                  if missing:
                      raise SystemExit(f"Missing required files for {scenario}/{base}: {missing}")
                  instances.append({
                      "scenario": scenario,
                      "base": base,
                      "file": str(root / f"{base}.txt"),
                      "vmax_file": str(root / f"{base}.vmax_ij.txt"),
                      "theta_file": str(root / f"{base}.theta_ijl.txt"),
                      "number_of_customer": customer_count,
                      "weight": 1 if customer_count == 200 else 3,
                  })

          instances.sort(key=lambda x: (x["scenario"], x["number_of_customer"], x["base"]))
          if len(instances) != 64:
              raise SystemExit(f"Expected 64 big instances across heavy/light, found {len(instances)}")

          tasks = []
          task_id = 0
          for inst in instances:
              for run in (1, 2, 3):
                  task_id += 1
                  task = dict(inst)
                  task.update({
                      "task_id": f"{task_id:04d}",
                      "drone_capacity": "2.27",
                      "run": run,
                  })
                  tasks.append(task)

          if len(tasks) != 192:
              raise SystemExit(f"Expected 192 tasks, found {len(tasks)}")

          # One solver process per non-empty job. There are fewer tasks than the
          # requested 250 jobs, so 192 buckets receive one task and 58 are empty.
          job_count = 250
          buckets = [[] for _ in range(job_count)]
          for index, task in enumerate(sorted(tasks, key=lambda x: (-x["weight"], x["scenario"], x["base"], x["run"]))):
              buckets[index].append(task)

          matrix = []
          for index, bucket in enumerate(buckets, start=1):
              matrix.append({
                  "job_id": f"{index:03d}",
                  "task_count": len(bucket),
                  "total_weight": sum(task["weight"] for task in bucket),
                  "tasks_json": json.dumps(bucket, separators=(",", ":")),
              })

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write("task_count=192\n")
              output.write("job_count=250\n")

          print("Created 192 solver tasks across 250 GitHub jobs")
          print("192 jobs contain one solver process; 58 jobs are empty because task_count < job_count")
          PYEOF

      - name: Upload solver
        uses: actions/upload-artifact@v4
        with:
          name: big-instance-dd227-solver
          path: build/big_instance_dd227/tabubu_big_instance_dd227
          retention-days: 1

  solve:
    name: job ${{ matrix.job_id }} | ${{ matrix.task_count }} task(s) | weight ${{ matrix.total_weight }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(github.event.inputs.max_parallel || '250') }}
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.experiment_matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: big-instance-dd227-solver
          path: build/big_instance_dd227

      - name: Run assigned big-instance task
        shell: bash
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
          TIME_LIMIT_SEC: ${{ github.event.inputs.time_limit_sec }}
        run: |
          set -euo pipefail
          chmod +x build/big_instance_dd227/tabubu_big_instance_dd227
          mkdir -p big_instance_dd227_results

          python3 - <<'PYEOF'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          solver = root / "build" / "big_instance_dd227" / "tabubu_big_instance_dd227"
          out_root = root / "big_instance_dd227_results"
          tasks = json.loads(os.environ["TASKS_JSON"])
          time_limit = os.environ.get("TIME_LIMIT_SEC", "7200")

          if not tasks:
              print("No task assigned to this bucket.")
              raise SystemExit(0)

          for task in tasks:
              scenario = task["scenario"]
              base = task["base"]
              run_id = str(task["run"])
              result_dir = out_root / scenario / base / f"run{run_id}"
              result_dir.mkdir(parents=True, exist_ok=True)
              log_path = result_dir / "run.log"
              result_path = result_dir / f"{scenario}.{base}.Dd227.run{run_id}.txt"

              cmd = [
                  str(solver),
                  str(root / task["file"]),
                  f"--truck-vmax-file={root / task['vmax_file']}",
                  f"--truck-theta-file={root / task['theta_file']}",
                  "--attempts=1",
              ]
              if time_limit:
                  cmd.append(f"--time-limit={time_limit}")

              with tempfile.TemporaryDirectory(prefix=f"big-{scenario}-{base}-run{run_id}-") as tmp:
                  tmp_path = Path(tmp)
                  with log_path.open("w", encoding="utf-8") as log:
                      log.write("Command: " + " ".join(cmd) + "\n")
                      log.write(f"Scenario: {scenario}\n")
                      log.write(f"Instance: {base}\n")
                      log.write("Drone capacity kg: 2.27\n")
                      log.write(f"Run: {run_id}\n\n")
                      completed = subprocess.run(
                          cmd,
                          cwd=tmp_path,
                          stdout=log,
                          stderr=subprocess.STDOUT,
                          text=True,
                      )

                  best_file = tmp_path / "output_solution_best.txt"
                  with result_path.open("w", encoding="utf-8") as result:
                      result.write(f"Scenario: {scenario}\n")
                      result.write(f"Instance: {base}\n")
                      result.write("Drone capacity kg: 2.27\n")
                      result.write(f"Run: {run_id}\n")
                      result.write(f"Solver exit code: {completed.returncode}\n")
                      result.write(f"Input file: {task['file']}\n")
                      result.write(f"Truck vmax file: {task['vmax_file']}\n")
                      result.write(f"Truck theta file: {task['theta_file']}\n\n")
                      if best_file.exists():
                          result.write(best_file.read_text(encoding="utf-8", errors="replace"))
                      else:
                          result.write("Final solution feasibility: FAILED\n")

                  for filename in ("output_solution_best.txt", "output_mode_0.txt"):
                      src = tmp_path / filename
                      if src.exists():
                          shutil.copy2(src, result_dir / f"{scenario}.{base}.Dd227.run{run_id}.{filename}")

                  if completed.returncode != 0:
                      raise SystemExit(
                          f"Task failed: {scenario}/{base}, Dd=2.27, run={run_id}; see {log_path}"
                      )
          PYEOF

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-instance-dd227-job-${{ matrix.job_id }}
          path: big_instance_dd227_results/**
          if-no-files-found: ignore
          retention-days: 14

  aggregate:
    name: Collect and aggregate big-instance results
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: big-instance-dd227-job-*
          path: collected_big_instance_dd227
          merge-multiple: true

      - name: Verify expected result count
        shell: bash
        run: |
          set -euo pipefail
          actual=$(find collected_big_instance_dd227 -type f \( -name '*.Dd227.run1.txt' -o -name '*.Dd227.run2.txt' -o -name '*.Dd227.run3.txt' \) | wc -l)
          echo "Collected ${actual} result files of 192 expected"
          test "$actual" -eq 192

      - name: Aggregate best objective and routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import csv
          import math
          import re
          import statistics
          import zipfile
          from collections import defaultdict
          from pathlib import Path
          from xml.sax.saxutils import escape

          results_dir = Path("collected_big_instance_dd227")
          detail_csv = Path("big_instance_dd227_all_runs.csv")
          best_csv = Path("big_instance_dd227_best_summary.csv")
          xlsx_path = Path("big_instance_dd227_summary.xlsx")

          def natural_key(value):
              return [int(part) if part.isdigit() else part for part in re.split(r"(\d+)", str(value))]

          def read_value(text, label):
              match = re.search(rf"^{re.escape(label)}:[ \t]*(.*?)[ \t]*$", text, re.MULTILINE)
              return match.group(1) if match else ""

          def as_float(value):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return ""

          def read_elapsed_seconds(text):
              value = read_value(text, "Mean elapsed time")
              value = value.removesuffix(" seconds").strip()
              return as_float(value)

          def extract_section(text, start_label, end_label=None):
              if start_label not in text:
                  return ""
              section = text.split(start_label, 1)[1]
              if end_label and end_label in section:
                  section = section.split(end_label, 1)[0]
              return section.strip()

          def route_customers(route_text):
              customers = []
              for line in route_text.splitlines():
                  if ":" not in line:
                      continue
                  body = line.split(":", 1)[1].split("|", 1)[0]
                  for token in re.findall(r"\d+", body):
                      customer = int(token)
                      if customer != 0:
                          customers.append(customer)
              return customers

          rows = []
          result_files = sorted(
              results_dir.rglob("*.Dd227.run*.txt"),
              key=lambda path: natural_key(str(path)),
          )
          for path in result_files:
              if not re.search(r"\.Dd227\.run[123]\.txt$", path.name):
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              scenario = read_value(text, "Scenario")
              instance = read_value(text, "Instance")
              run = read_value(text, "Run")
              customer_count = int(instance.split(".", 1)[0])
              best_obj = as_float(read_value(text, "Improved solution cost"))
              elapsed_seconds = read_elapsed_seconds(text)
              feasibility = read_value(text, "Final solution feasibility")
              truck_routes = extract_section(text, "Truck Routes:\n", "\nDrone Routes:")
              drone_routes = extract_section(text, "Drone Routes:\n", "\nTotal validation:")
              drone_customers = set(route_customers(drone_routes))
              drone_ratio = len(drone_customers) / customer_count if customer_count else ""
              rows.append({
                  "scenario": scenario,
                  "instance": instance,
                  "run": int(run) if run else "",
                  "best_obj": best_obj,
                  "elapsed_seconds": elapsed_seconds,
                  "feasibility": feasibility,
                  "drone_customer_count": len(drone_customers),
                  "customer_count": customer_count,
                  "drone_ratio": drone_ratio,
                  "truck_routes": truck_routes,
                  "drone_routes": drone_routes,
                  "result_file": str(path),
              })

          if len(rows) != 192:
              raise SystemExit(f"Expected 192 parsed rows, found {len(rows)}")

          detail_fields = [
              "scenario", "instance", "run", "best_obj", "elapsed_seconds", "feasibility",
              "drone_customer_count", "customer_count", "drone_ratio",
              "truck_routes", "drone_routes", "result_file",
          ]
          with detail_csv.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=detail_fields)
              writer.writeheader()
              writer.writerows(rows)

          best_rows = []
          groups = defaultdict(list)
          for row in rows:
              groups[(row["scenario"], row["instance"])].append(row)
          for (scenario, instance), group in sorted(groups.items(), key=lambda item: (item[0][0], natural_key(item[0][1]))):
              feasible = [row for row in group if row["feasibility"] == "FEASIBLE" and isinstance(row["best_obj"], float)]
              candidates = feasible or [row for row in group if isinstance(row["best_obj"], float)]
              best = min(candidates, key=lambda row: row["best_obj"]) if candidates else group[0]
              numeric_objs = [row["best_obj"] for row in group if isinstance(row["best_obj"], float)]
              numeric_elapsed = [row["elapsed_seconds"] for row in group if isinstance(row["elapsed_seconds"], float)]
              best_rows.append({
                  "scenario": scenario,
                  "instance": instance,
                  "best_run": best["run"],
                  "best_obj": best["best_obj"],
                  "best_elapsed_seconds": best["elapsed_seconds"],
                  "mean_obj_3_runs": statistics.fmean(numeric_objs) if numeric_objs else "",
                  "mean_elapsed_seconds_3_runs": statistics.fmean(numeric_elapsed) if numeric_elapsed else "",
                  "feasible_runs": sum(row["feasibility"] == "FEASIBLE" for row in group),
                  "drone_customer_count": best["drone_customer_count"],
                  "customer_count": best["customer_count"],
                  "drone_ratio": best["drone_ratio"],
                  "truck_routes": best["truck_routes"],
                  "drone_routes": best["drone_routes"],
                  "result_file": best["result_file"],
              })

          best_fields = [
              "scenario", "instance", "best_run", "best_obj", "best_elapsed_seconds",
              "mean_obj_3_runs", "mean_elapsed_seconds_3_runs",
              "feasible_runs", "drone_customer_count", "customer_count",
              "drone_ratio", "truck_routes", "drone_routes", "result_file",
          ]
          with best_csv.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=best_fields)
              writer.writeheader()
              writer.writerows(best_rows)

          def col_name(index):
              result = ""
              while index:
                  index, rem = divmod(index - 1, 26)
                  result = chr(65 + rem) + result
              return result

          def cell_xml(row_index, col_index, value, style=0):
              ref = f"{col_name(col_index)}{row_index}"
              style_attr = f' s="{style}"' if style else ""
              if isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value):
                  return f'<c r="{ref}"{style_attr}><v>{value}</v></c>'
              return f'<c r="{ref}" t="inlineStr"{style_attr}><is><t>{escape(str(value))}</t></is></c>'

          def worksheet(headers, data_rows):
              wrapped = {i for i, h in enumerate(headers, 1) if h in {"truck_routes", "drone_routes"}}
              xml_rows = []
              for row_index, values in enumerate([headers, *data_rows], 1):
                  cells = "".join(
                      cell_xml(row_index, col_index, value, 1 if row_index == 1 else (2 if col_index in wrapped else 0))
                      for col_index, value in enumerate(values, 1)
                  )
                  xml_rows.append(f'<row r="{row_index}">{cells}</row>')
              cols = "".join(
                  f'<col min="{i}" max="{i}" width="{55 if h in {"truck_routes", "drone_routes"} else 18}" customWidth="1"/>'
                  for i, h in enumerate(headers, 1)
              )
              last = f"{col_name(len(headers))}{len(data_rows) + 1}"
              return (
                  '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                  '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
                  f'<dimension ref="A1:{last}"/>'
                  '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
                  f'<cols>{cols}</cols><sheetData>{"".join(xml_rows)}</sheetData>'
                  f'<autoFilter ref="A1:{last}"/></worksheet>'
              )

          sheets = [
              ("Best", worksheet(best_fields, [[row[field] for field in best_fields] for row in best_rows])),
              ("All Runs", worksheet(detail_fields, [[row[field] for field in detail_fields] for row in rows])),
          ]
          content_types = (
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
              '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
              '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
              '<Default Extension="xml" ContentType="application/xml"/>'
              '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
              '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
              + "".join(f'<Override PartName="/xl/worksheets/sheet{i}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' for i in range(1, len(sheets) + 1))
              + '</Types>'
          )
          workbook = (
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
              '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
              'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
              + "".join(f'<sheet name="{escape(name)}" sheetId="{i}" r:id="rId{i}"/>' for i, (name, _) in enumerate(sheets, 1))
              + '</sheets></workbook>'
          )
          workbook_rels = (
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
              '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
              + "".join(f'<Relationship Id="rId{i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet{i}.xml"/>' for i in range(1, len(sheets) + 1))
              + f'<Relationship Id="rId{len(sheets) + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
              '</Relationships>'
          )
          styles = (
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
              '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
              '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
              '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
              '<borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
              '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
              '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
              '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs>'
              '</styleSheet>'
          )
          with zipfile.ZipFile(xlsx_path, "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("[Content_Types].xml", content_types)
              z.writestr("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')
              z.writestr("xl/workbook.xml", workbook)
              z.writestr("xl/_rels/workbook.xml.rels", workbook_rels)
              z.writestr("xl/styles.xml", styles)
              for i, (_, xml) in enumerate(sheets, 1):
                  z.writestr(f"xl/worksheets/sheet{i}.xml", xml)

          print(f"Wrote {best_csv}, {detail_csv}, and {xlsx_path}")
          PYEOF

      - name: Upload collected results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-instance-heavy-light-dd227-results
          path: |
            collected_big_instance_dd227/**
            big_instance_dd227_best_summary.csv
            big_instance_dd227_all_runs.csv
            big_instance_dd227_summary.xlsx
          if-no-files-found: warn
          retention-days: 30
