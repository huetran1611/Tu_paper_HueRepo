name: Time-dependent DR and SA ablation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Build solver and prepare 250 balanced jobs
    runs-on: ubuntu-latest
    outputs:
      experiment_matrix: ${{ steps.matrix.outputs.matrix }}
      total_tasks: ${{ steps.matrix.outputs.total_tasks }}
      total_instances: ${{ steps.matrix.outputs.total_instances }}
    steps:
      - uses: actions/checkout@v5

      - name: Compile DR-SA ablation solver
        run: |
          g++ -O2 -std=c++20 tabubu_time_dependent_DR_SA_Ablation.cpp -o tabubu_time_dependent_dr_sa_ablation

      - name: Generate 200-customer group 2, 3, and 4 tasks across 250 jobs
        id: matrix
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os
          from collections import Counter

          prefixes = ("200",)

          def instance_sort_key(path):
              name = os.path.basename(path)[:-4]
              return tuple(int(part) for part in name.split("."))

          instances = []
          for path in glob.glob("instance_time_dependent/*.txt"):
              name = os.path.basename(path)
              if name.endswith((".vmax_ij.txt", ".theta_ijl.txt")):
                  continue
              if name.split(".", 1)[0] in prefixes:
                  instances.append(path)
          instances.sort(key=instance_sort_key)

          if not instances:
              raise SystemExit("No matching 200-customer instances found")
          if len(instances) != 16:
              raise SystemExit(f"Expected 16 200-customer instances, found {len(instances)}")

          group2 = [
              ("dr_random_0_1", "Destroy-and-repair", "Random, r_d=0.1", 10),
              ("dr_random_0_2", "Destroy-and-repair", "Random, r_d=0.2", 15),
              ("dr_random_0_3", "Destroy-and-repair", "Random, r_d=0.3", 10),
              ("dr_worst_0_1", "Destroy-and-repair", "Worst, r_d=0.1", 10),
              ("dr_worst_0_2", "Destroy-and-repair", "Worst, r_d=0.2", 10),
              ("dr_worst_0_3", "Destroy-and-repair", "Worst, r_d=0.3", 10),
          ]
          group3 = [
              ("sa_T100_a0_998", "Simulated-annealing", "(T0,alpha)=(100,0.998)", 10),
              ("sa_T100_a0_9998", "Simulated-annealing", "(T0,alpha)=(100,0.9998)", 10),
              ("sa_T150_a0_998", "Simulated-annealing", "(T0,alpha)=(150,0.998)", 10),
              ("sa_T150_a0_9998", "Simulated-annealing", "(T0,alpha)=(150,0.9998)", 15),
          ]
          group4 = [
              ("both_worst_0_2_T150_a0_9998", "Both components", "Worst, r_d=0.2; (T0,alpha)=(150,0.9998)", 15),
          ]
          configs = group2 + group3 + group4

          group_weight = {
              "200": 50,
          }

          tasks = []
          task_index = 0
          for instance_path in instances:
              instance = os.path.basename(instance_path)[:-4]
              customer_group = instance.split(".", 1)[0]
              for config_key, component, setting, repetitions in configs:
                  for repetition in range(1, repetitions + 1):
                      task_index += 1
                      tasks.append({
                          "instance": instance,
                          "customer_group": customer_group,
                          "component": component,
                          "setting": setting,
                          "config": config_key,
                          "repetition": repetition,
                          "seed": 530000 + task_index,
                          "weight": group_weight[customer_group],
                      })

          expected_tasks = len(instances) * sum(repetitions for _, _, _, repetitions in configs)
          if len(tasks) != expected_tasks:
              raise SystemExit(f"Expected {expected_tasks} tasks, found {len(tasks)}")

          # Balance by estimated runtime, not only by task count. Larger customer groups
          # are heavier, so we assign heaviest tasks first to the currently lightest batch.
          batches = [[] for _ in range(250)]
          batch_weights = [0 for _ in batches]
          tasks.sort(
              key=lambda task: (
                  task["weight"],
                  tuple(int(part) for part in task["instance"].split(".")),
                  task["config"],
                  task["repetition"],
              ),
              reverse=True,
          )
          for task in tasks:
              lightest_index = min(
                  range(len(batches)),
                  key=lambda index: (batch_weights[index], len(batches[index]), index),
              )
              batches[lightest_index].append(task)
              batch_weights[lightest_index] += task["weight"]

          empty_jobs = sum(1 for batch in batches if not batch)
          if empty_jobs:
              raise SystemExit(f"Only {len(tasks)} tasks for 250 jobs; {empty_jobs} jobs would be empty")

          distribution = Counter(map(len, batches))
          weight_distribution = Counter(batch_weights)
          min_weight = min(batch_weights)
          max_weight = max(batch_weights)
          matrix = [
              {
                  "batch_id": f"{index + 1:03d}",
                  "batch_index": index,
                  "estimated_weight": batch_weights[index],
              }
              for index, batch in enumerate(batches)
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"total_tasks={len(tasks)}\n")
              output.write(f"total_instances={len(instances)}\n")

          print(f"Found {len(instances)} instances")
          print(f"Created {len(tasks)} tasks: 125 runs per instance")
          print(f"Distributed across 250 jobs: {dict(sorted(distribution.items()))}")
          print(f"Estimated weight range: min={min_weight}, max={max_weight}")
          print(f"Estimated weight distribution: {dict(sorted(weight_distribution.items()))}")
          PYEOF

      - name: Upload solver
        uses: actions/upload-artifact@v4
        with:
          name: time-dependent-dr-sa-ablation-solver
          path: tabubu_time_dependent_dr_sa_ablation
          retention-days: 1

  solve:
    name: DR-SA ablation batch ${{ matrix.batch_id }} w${{ matrix.estimated_weight }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 250
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.experiment_matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: time-dependent-dr-sa-ablation-solver

      - name: Run assigned repetitions in parallel
        shell: bash
        run: |
          chmod +x tabubu_time_dependent_dr_sa_ablation
          mkdir -p dr_sa_ablation_results/raw dr_sa_ablation_results/logs
          python3 - <<'PYEOF'
          import csv
          import glob
          import json
          import os
          import subprocess
          from pathlib import Path

          solver = Path.cwd() / "tabubu_time_dependent_dr_sa_ablation"
          raw_dir = Path("dr_sa_ablation_results/raw")
          log_dir = Path("dr_sa_ablation_results/logs")
          raw_dir.mkdir(parents=True, exist_ok=True)
          log_dir.mkdir(parents=True, exist_ok=True)

          batch_index = int("${{ matrix.batch_index }}")

          prefixes = ("200",)
          group_weight = {"200": 50}
          configs = [
              ("dr_random_0_1", "Destroy-and-repair", "Random, r_d=0.1", 10),
              ("dr_random_0_2", "Destroy-and-repair", "Random, r_d=0.2", 15),
              ("dr_random_0_3", "Destroy-and-repair", "Random, r_d=0.3", 10),
              ("dr_worst_0_1", "Destroy-and-repair", "Worst, r_d=0.1", 10),
              ("dr_worst_0_2", "Destroy-and-repair", "Worst, r_d=0.2", 10),
              ("dr_worst_0_3", "Destroy-and-repair", "Worst, r_d=0.3", 10),
              ("sa_T100_a0_998", "Simulated-annealing", "(T0,alpha)=(100,0.998)", 10),
              ("sa_T100_a0_9998", "Simulated-annealing", "(T0,alpha)=(100,0.9998)", 10),
              ("sa_T150_a0_998", "Simulated-annealing", "(T0,alpha)=(150,0.998)", 10),
              ("sa_T150_a0_9998", "Simulated-annealing", "(T0,alpha)=(150,0.9998)", 15),
              ("both_worst_0_2_T150_a0_9998", "Both components", "Worst, r_d=0.2; (T0,alpha)=(150,0.9998)", 15),
          ]

          def instance_sort_key(path):
              name = os.path.basename(path)[:-4]
              return tuple(int(part) for part in name.split("."))

          instances = []
          for path in glob.glob("instance_time_dependent/*.txt"):
              name = os.path.basename(path)
              if name.endswith((".vmax_ij.txt", ".theta_ijl.txt")):
                  continue
              if name.split(".", 1)[0] in prefixes:
                  instances.append(path)
          instances.sort(key=instance_sort_key)
          if len(instances) != 16:
              raise SystemExit(f"Expected 16 200-customer instances, found {len(instances)}")

          all_tasks = []
          task_index = 0
          for instance_path in instances:
              instance = os.path.basename(instance_path)[:-4]
              customer_group = instance.split(".", 1)[0]
              for config_key, component, setting, repetitions in configs:
                  for repetition in range(1, repetitions + 1):
                      task_index += 1
                      all_tasks.append({
                          "instance": instance,
                          "customer_group": customer_group,
                          "component": component,
                          "setting": setting,
                          "config": config_key,
                          "repetition": repetition,
                          "seed": 530000 + task_index,
                          "weight": group_weight[customer_group],
                      })

          batches = [[] for _ in range(250)]
          batch_weights = [0 for _ in batches]
          all_tasks.sort(
              key=lambda task: (
                  task["weight"],
                  tuple(int(part) for part in task["instance"].split(".")),
                  task["config"],
                  task["repetition"],
              ),
              reverse=True,
          )
          for task in all_tasks:
              lightest_index = min(
                  range(len(batches)),
                  key=lambda index: (batch_weights[index], len(batches[index]), index),
              )
              batches[lightest_index].append(task)
              batch_weights[lightest_index] += task["weight"]
          tasks = batches[batch_index]
          print(f"Batch {batch_index + 1:03d}: {len(tasks)} tasks, estimated weight {batch_weights[batch_index]}")

          fieldnames = [
              "Instance",
              "Customer group",
              "Component",
              "Setting",
              "Config",
              "Repetition",
              "Seed",
              "Solver exit code",
              "Initial cost",
              "Improved cost",
              "Worst cost",
              "Mean cost",
              "Elapsed seconds",
              "Feasibility",
              "Truck routes",
              "Drone routes",
              "Validated makespan",
              "Deadline violation",
              "Energy violation",
              "Capacity violation",
              "Full solution",
          ]

          def blank_row(task, exit_code):
              return {
                  "Instance": task["instance"],
                  "Customer group": task["customer_group"],
                  "Component": task["component"],
                  "Setting": task["setting"],
                  "Config": task["config"],
                  "Repetition": task["repetition"],
                  "Seed": task["seed"],
                  "Solver exit code": exit_code,
                  "Initial cost": "",
                  "Improved cost": "",
                  "Worst cost": "",
                  "Mean cost": "",
                  "Elapsed seconds": "",
                  "Feasibility": "",
                  "Truck routes": "",
                  "Drone routes": "",
                  "Validated makespan": "",
                  "Deadline violation": "",
                  "Energy violation": "",
                  "Capacity violation": "",
                  "Full solution": "",
              }

          def value_after_colon(line):
              return line.split(":", 1)[1].strip()

          def parse_solution_file(path):
              text = path.read_text(encoding="utf-8", errors="replace")
              parsed = {
                  "Initial cost": "",
                  "Improved cost": "",
                  "Worst cost": "",
                  "Mean cost": "",
                  "Elapsed seconds": "",
                  "Feasibility": "",
                  "Truck routes": "",
                  "Drone routes": "",
                  "Validated makespan": "",
                  "Deadline violation": "",
                  "Energy violation": "",
                  "Capacity violation": "",
                  "Full solution": text,
              }
              truck_routes = []
              drone_routes = []
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("Initial solution cost:"):
                      parsed["Initial cost"] = value_after_colon(stripped)
                  elif stripped.startswith("Improved solution cost:"):
                      parsed["Improved cost"] = value_after_colon(stripped)
                  elif stripped.startswith("Worst solution cost:"):
                      parsed["Worst cost"] = value_after_colon(stripped)
                  elif stripped.startswith("Mean solution cost:"):
                      parsed["Mean cost"] = value_after_colon(stripped)
                  elif stripped.startswith("Mean elapsed time:"):
                      parsed["Elapsed seconds"] = value_after_colon(stripped).replace(" seconds", "")
                  elif stripped.startswith("Final solution feasibility:"):
                      parsed["Feasibility"] = value_after_colon(stripped)
                  elif stripped.startswith("Truck "):
                      truck_routes.append(stripped)
                  elif stripped.startswith("Drone "):
                      drone_routes.append(stripped)
                  elif stripped.startswith("Total validation:"):
                      validation = stripped.split(":", 1)[1]
                      for item in validation.split(","):
                          if "=" not in item:
                              continue
                          key, value = item.strip().split("=", 1)
                          if key == "Makespan":
                              parsed["Validated makespan"] = value
                          elif key == "Deadline violation":
                              parsed["Deadline violation"] = value
                          elif key == "Energy violation":
                              parsed["Energy violation"] = value
                          elif key == "Capacity violation":
                              parsed["Capacity violation"] = value
              parsed["Truck routes"] = " || ".join(truck_routes)
              parsed["Drone routes"] = " || ".join(drone_routes)
              return parsed

          processes = []
          for task in tasks:
              instance = task["instance"]
              config = task["config"]
              repetition = int(task["repetition"])
              input_path = Path("instance_time_dependent") / f"{instance}.txt"
              if not input_path.exists():
                  raise SystemExit(f"Missing instance file: {input_path}")

              prefix = raw_dir / f"{instance}_{config}_rep{repetition:02d}"
              command = [
                  str(solver),
                  str(input_path),
                  "--attempts=1",
                  f"--config={config}",
                  f"--ablation-prefix={prefix}",
                  f"--seed-base={task['seed']}",
              ]

              vmax_path = Path("instance_time_dependent") / f"{instance}.vmax_ij.txt"
              theta_path = Path("instance_time_dependent") / f"{instance}.theta_ijl.txt"
              if vmax_path.exists():
                  command.append(f"--truck-vmax-file={vmax_path}")
              if theta_path.exists():
                  command.append(f"--truck-theta-file={theta_path}")

              log_path = log_dir / f"{instance}_{config}_rep{repetition:02d}.log"
              log_file = log_path.open("w", encoding="utf-8")
              processes.append((task, prefix, log_file, subprocess.Popen(command, stdout=log_file, stderr=subprocess.STDOUT)))

          failed = []
          rows = []
          for task, prefix, log_file, process in processes:
              return_code = process.wait()
              log_file.close()
              row = blank_row(task, return_code)
              solution_path = Path(f"{prefix}_{task['config']}_solution_best.txt")
              if solution_path.exists():
                  row.update(parse_solution_file(solution_path))
              elif return_code == 0:
                  failed.append((task, "missing-solution"))
              rows.append(row)
              if return_code != 0:
                  failed.append((task, return_code))

          if failed:
              print(f"Failed tasks recorded in CSV: {failed}")

          rows.sort(key=lambda row: (
              tuple(int(part) for part in row["Instance"].split(".")),
              row["Config"],
              int(row["Repetition"]),
          ))
          out_path = Path("dr_sa_ablation_results") / "batch_results.csv"
          with out_path.open("w", newline="", encoding="utf-8") as csv_file:
              writer = csv.DictWriter(csv_file, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"Completed {len(rows)} repetitions in this batch")
          PYEOF

      - name: Upload batch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-sa-ablation-batch-${{ matrix.batch_id }}
          path: |
            dr_sa_ablation_results/batch_results.csv
            dr_sa_ablation_results/raw/*_summary.csv
            dr_sa_ablation_results/raw/*_solution_best.txt
            dr_sa_ablation_results/logs/*.log
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate DR-SA ablation results
    needs:
      - prepare
      - solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dr-sa-ablation-batch-*
          path: collected_dr_sa_ablation_results
          merge-multiple: false

      - name: Aggregate CSV and LaTeX summaries
        run: |
          python3 - <<'PYEOF'
          import csv
          import glob
          from collections import Counter, defaultdict
          from pathlib import Path

          expected_total = int("${{ needs.prepare.outputs.total_tasks }}")
          expected_instances = int("${{ needs.prepare.outputs.total_instances }}")

          rows = []
          for path in glob.glob("collected_dr_sa_ablation_results/**/batch_results.csv", recursive=True):
              with open(path, newline="", encoding="utf-8") as csv_file:
                  rows.extend(csv.DictReader(csv_file))

          if len(rows) != expected_total:
              raise SystemExit(f"Expected {expected_total} rows, found {len(rows)}")

          fieldnames = [
              "Instance",
              "Customer group",
              "Component",
              "Setting",
              "Config",
              "Repetition",
              "Seed",
              "Solver exit code",
              "Initial cost",
              "Improved cost",
              "Worst cost",
              "Mean cost",
              "Elapsed seconds",
              "Feasibility",
              "Truck routes",
              "Drone routes",
              "Validated makespan",
              "Deadline violation",
              "Energy violation",
              "Capacity violation",
              "Full solution",
          ]

          expected_repetitions = {
              "dr_random_0_1": 10,
              "dr_random_0_2": 15,
              "dr_random_0_3": 10,
              "dr_worst_0_1": 10,
              "dr_worst_0_2": 10,
              "dr_worst_0_3": 10,
              "sa_T100_a0_998": 10,
              "sa_T100_a0_9998": 10,
              "sa_T150_a0_998": 10,
              "sa_T150_a0_9998": 15,
              "both_worst_0_2_T150_a0_9998": 15,
          }

          instances = sorted({row["Instance"] for row in rows}, key=lambda name: tuple(int(part) for part in name.split(".")))
          if len(instances) != expected_instances:
              raise SystemExit(f"Expected {expected_instances} instances, found {len(instances)}")

          counts = Counter((row["Instance"], row["Config"]) for row in rows)
          for instance in instances:
              for config, expected_count in expected_repetitions.items():
                  actual = counts[(instance, config)]
                  if actual != expected_count:
                      raise SystemExit(f"{instance} / {config} has {actual} rows, expected {expected_count}")

          rows.sort(key=lambda row: (
              tuple(int(part) for part in row["Instance"].split(".")),
              row["Config"],
              int(row["Repetition"]),
          ))

          detailed_path = Path("dr_sa_time_dependent_ablation_results.csv")
          with detailed_path.open("w", newline="", encoding="utf-8") as csv_file:
              writer = csv.DictWriter(csv_file, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          grouped = defaultdict(list)
          for row in rows:
              grouped[row["Config"]].append(row)

          config_order = list(expected_repetitions)
          summary_rows = []
          for config in config_order:
              group = grouped[config]
              successful = [row for row in group if row["Solver exit code"] == "0" and row["Improved cost"]]
              if successful:
                  best_values = [float(row["Improved cost"]) for row in successful]
                  mean_values = [float(row["Mean cost"] or row["Improved cost"]) for row in successful]
                  time_values = [float(row["Elapsed seconds"]) for row in successful if row["Elapsed seconds"]]
                  best_cost = min(best_values)
                  mean_cost = sum(mean_values) / len(mean_values)
                  worst_cost = max(best_values)
                  mean_elapsed = sum(time_values) / len(time_values) if time_values else ""
              else:
                  best_cost = mean_cost = worst_cost = mean_elapsed = ""
              representative = group[0]
              feasible_count = sum(1 for row in group if row["Feasibility"].upper() == "FEASIBLE")
              nonzero_exit_count = sum(1 for row in group if row["Solver exit code"] != "0")
              summary_rows.append({
                  "component": representative["Component"],
                  "setting": representative["Setting"],
                  "config": config,
                  "runs": len(group),
                  "successful_runs": len(successful),
                  "nonzero_exit_count": nonzero_exit_count,
                  "best_cost": best_cost,
                  "mean_cost": mean_cost,
                  "worst_cost": worst_cost,
                  "mean_elapsed_sec": mean_elapsed,
                  "feasible_runs": feasible_count,
              })

          summary_path = Path("dr_sa_time_dependent_ablation_summary.csv")
          with summary_path.open("w", newline="", encoding="utf-8") as csv_file:
              summary_fieldnames = [
                  "component",
                  "setting",
                  "config",
                  "runs",
                  "successful_runs",
                  "nonzero_exit_count",
                  "best_cost",
                  "mean_cost",
                  "worst_cost",
                  "mean_elapsed_sec",
                  "feasible_runs",
              ]
              writer = csv.DictWriter(csv_file, fieldnames=summary_fieldnames)
              writer.writeheader()
              writer.writerows(summary_rows)

          tex_path = Path("dr_sa_time_dependent_ablation_summary.tex")
          with tex_path.open("w", encoding="utf-8") as tex_file:
              tex_file.write("\\begin{tabular}{llrrrrr}\\n")
              tex_file.write("\\toprule\\n")
              tex_file.write("Component & Setting & Runs & Best & Mean & Worst & Mean Time (s) \\\\\\n")
              tex_file.write("\\midrule\\n")
              for row in summary_rows:
                  best_cost = f"{row['best_cost']:.6f}" if row["best_cost"] != "" else ""
                  mean_cost = f"{row['mean_cost']:.6f}" if row["mean_cost"] != "" else ""
                  worst_cost = f"{row['worst_cost']:.6f}" if row["worst_cost"] != "" else ""
                  mean_elapsed = f"{row['mean_elapsed_sec']:.3f}" if row["mean_elapsed_sec"] != "" else ""
                  tex_file.write(
                      f"{row['component']} & {row['setting']} & {row['runs']} & "
                      f"{best_cost} & {mean_cost} & {worst_cost} & {mean_elapsed} \\\\\\n"
                  )
              tex_file.write("\\bottomrule\\n")
              tex_file.write("\\end{tabular}\\n")

          print(f"Aggregated {len(rows)} runs across {len(instances)} instances")
          PYEOF

      - name: Upload consolidated DR-SA ablation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-sa-time-dependent-ablation-results
          path: |
            dr_sa_time_dependent_ablation_results.csv
            dr_sa_time_dependent_ablation_summary.csv
            dr_sa_time_dependent_ablation_summary.tex
          if-no-files-found: warn
          retention-days: 30
