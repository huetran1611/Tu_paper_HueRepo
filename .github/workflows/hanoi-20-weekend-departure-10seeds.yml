name: Hanoi 20 selected - Saturday Sunday - departure 7h to 10h

on:
  push:
    branches:
      - test_hanoi
    paths:
      - .github/workflows/hanoi-20-weekend-departure-10seeds.yml
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Maximum parallel jobs (1 to 40)"
        required: true
        default: "40"
      time_limit_seconds:
        description: "Per-run time limit in seconds (1 to 1800)"
        required: true
        default: "1800"
      segment_iterations:
        description: "Iterations per segment"
        required: true
        default: "100"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SPEED_PROFILE_ROOT: instance_hanoi/datasets/hanoi_traffic/experiment_speed_profiles

jobs:
  prepare:
    name: Validate and build solver
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate inputs and data
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel || '40' }}
          TIME_LIMIT: ${{ inputs.time_limit_seconds || '1800' }}
          SEGMENT_ITERS: ${{ inputs.segment_iterations || '100' }}
        run: |
          set -euo pipefail
          [[ "$MAX_PARALLEL" =~ ^[1-9][0-9]*$ ]]
          [[ "$TIME_LIMIT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEGMENT_ITERS" =~ ^[1-9][0-9]*$ ]]
          test "$MAX_PARALLEL" -le 40
          test "$TIME_LIMIT" -le 1800
          python3 scripts/hanoi_case_study_33_cloud.py validate-data --profile-root "$SPEED_PROFILE_ROOT"
      - name: Build V2 solver
        run: |
          mkdir -p build/hanoi_weekend
          g++ -O3 -std=c++20 src_v2/tabubu_HanoiTraffic_v2.cpp -o build/hanoi_weekend/tabubu_HanoiTraffic_v2
      - name: Build 250-job matrix for 1600 runs
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/hanoi_20_weekend_departure.py matrix)"
          python3 -c 'import json,sys; m=json.loads(sys.argv[1]); assert len(m["include"])==250; assert sum(j["task_count"] for j in m["include"])==1600' "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Smoke test both weekend speed profiles
        run: |
          set -euo pipefail
          root="$PWD"
          work="$(mktemp -d)"
          python3 scripts/hanoi_case_study_33_cloud.py build-dataset-profiles \
            --profile-root "$SPEED_PROFILE_ROOT" --work-root "$work/profiles" --dataset set_03
          stem="$root/instance_hanoi/datasets/hanoi_traffic/Hanoi_selected_20/set_03/hanoi_10x10_100_set_03_weekday"
          for profile in thu7 chunhat; do
            speed="$work/profiles/set_03/$profile.v_ijl_kph.txt"
            test "$(grep -vc '^#' "$speed")" -eq 122412
            mkdir "$work/$profile"
            (cd "$work/$profile" && "$root/build/hanoi_weekend/tabubu_HanoiTraffic_v2" "$stem.txt" \
              --truck-distance-file="$stem.truck_distance_m.txt" \
              --drone-distance-file="$stem.drone_distance_m.txt" --truck-vijl-file="$speed" \
              --start-hour=7 --attempts=1 --iters=2 --segment-iters=1 --time-limit=60 --seed=1 --auto-tune)
            test -s "$work/$profile/output_solution_best.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hanoi-20-weekend-solver
          path: build/hanoi_weekend/tabubu_HanoiTraffic_v2
          if-no-files-found: error
          retention-days: 2

  solve:
    name: ${{ matrix.batch_id }} | ${{ matrix.task_count }} runs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '40') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hanoi-20-weekend-solver
          path: build/hanoi_weekend
      - name: Run weekend departures
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
          BATCH_ID: ${{ matrix.batch_id }}
          TIME_LIMIT: ${{ inputs.time_limit_seconds || '1800' }}
          SEGMENT_ITERS: ${{ inputs.segment_iterations || '100' }}
        run: |
          set -euo pipefail
          chmod +x build/hanoi_weekend/tabubu_HanoiTraffic_v2
          python3 scripts/hanoi_20_weekend_departure.py run-batch \
            --binary build/hanoi_weekend/tabubu_HanoiTraffic_v2 \
            --profile-root "$SPEED_PROFILE_ROOT" --work-root "$RUNNER_TEMP/weekend_profiles" \
            --tasks-json "$TASKS_JSON" --batch-id "$BATCH_ID" \
            --time-limit "$TIME_LIMIT" --segment-iters "$SEGMENT_ITERS" --output result
      - name: Upload results and solver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-20-weekend-${{ matrix.batch_id }}
          path: result/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate Saturday and Sunday results
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Excel dependency
        run: python3 -m pip install --disable-pip-version-check openpyxl
      - uses: actions/download-artifact@v4
        with:
          pattern: hanoi-20-weekend-batch-*
          path: collected_results
      - name: Build result workbooks
        run: |
          python3 scripts/hanoi_20_weekend_departure.py aggregate \
            --input-root collected_results \
            --output instance_hanoi/datasets/hanoi_traffic/Hanoi_selected_20/results/weekend_departure
      - name: Upload combined and per-profile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-20-weekend-departure-10seeds-results
          path: instance_hanoi/datasets/hanoi_traffic/Hanoi_selected_20/results/weekend_departure/
          if-no-files-found: warn
          retention-days: 90
