name: Hanoi case study - 20 selected instances - single trip

on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Maximum concurrent GitHub jobs (account limit: 40)"
        required: true
        default: "40"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SPEED_PROFILE_ROOT: instance_hanoi/datasets/hanoi_traffic/experiment_speed_profiles

jobs:
  prepare:
    name: Validate 20 selected instances and build single-trip solver
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate workflow input
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAX_PARALLEL" =~ ^[1-9][0-9]*$ ]]
          test "$MAX_PARALLEL" -le 40

      - name: Validate source data
        run: |
          python3 scripts/hanoi_case_study_33_cloud.py validate-data \
            --profile-root "$SPEED_PROFILE_ROOT"

      - name: Build V2 Hanoi solver
        run: |
          mkdir -p build/hanoi_case_single_trip
          g++ -O3 -std=c++20 src_v2/tabubu_HanoiTraffic_v2.cpp \
            -o build/hanoi_case_single_trip/tabubu_HanoiTraffic_v2

      - name: Build balanced 250-job matrix for 2400 ST runs
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/hanoi_case_study_33_cloud.py single-trip-matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          python3 -c 'import collections,json,sys; m=json.loads(sys.argv[1]); c=collections.Counter(x["task_count"] for x in m["include"]); assert len(m["include"])==250; assert sum(x["task_count"] for x in m["include"])==2400; assert c=={10:150,9:100}' "$matrix"

      - name: Smoke test single-trip constraint with 12 traffic segments
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          work="$(mktemp -d)"
          python3 scripts/hanoi_case_study_33_cloud.py build-dataset-profiles \
            --profile-root "$SPEED_PROFILE_ROOT" \
            --work-root "$work/profiles" \
            --dataset set_03
          speed="$work/profiles/set_03/weekday.v_ijl_kph.txt"
          test "$(grep -vc '^#' "$speed")" -eq 122412
          stem="$root/instance_hanoi/datasets/hanoi_traffic/Hanoi_selected_20/set_03/hanoi_10x10_100_set_03_weekday"
          mkdir "$work/solve"
          cd "$work/solve"
          "$root/build/hanoi_case_single_trip/tabubu_HanoiTraffic_v2" "$stem.txt" \
            --truck-distance-file="$stem.truck_distance_m.txt" \
            --drone-distance-file="$stem.drone_distance_m.txt" \
            --truck-vijl-file="$speed" \
            --start-hour=7 --truck-single-trip \
            --attempts=1 --iters=2 --segment-iters=1 --time-limit=60 --seed=1
          test -s output_solution_best.txt
          grep -q "Loaded 12 traffic segments from 6h to 17h" solver.log 2>/dev/null || true
          python3 -c 'import re; t=open("output_solution_best.txt").read(); lines=[x for x in t.splitlines() if re.match(r"^Truck \d+:",x)]; assert lines; assert all([int(v) for v in x.split(":",1)[1].split("|",1)[0].split()][1:-1].count(0)==0 for x in lines)'

      - uses: actions/upload-artifact@v4
        with:
          name: hanoi-case-20-single-trip-solver
          path: build/hanoi_case_single_trip/tabubu_HanoiTraffic_v2
          if-no-files-found: error
          retention-days: 2

  solve:
    name: ${{ matrix.batch_id }} | ${{ matrix.task_count }} sequential ST runs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: hanoi-case-20-single-trip-solver
          path: build/hanoi_case_single_trip

      - name: Run single-trip AMSTS tasks
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
        shell: bash
        run: |
          set -euo pipefail
          binary="build/hanoi_case_single_trip/tabubu_HanoiTraffic_v2"
          chmod +x "$binary"
          python3 scripts/hanoi_case_study_33_cloud.py run-single-trip-batch \
            --binary "$binary" \
            --profile-root "$SPEED_PROFILE_ROOT" \
            --work-root "$RUNNER_TEMP/hanoi_case_profiles" \
            --tasks-json "$TASKS_JSON" \
            --output result

      - name: Upload ST results and final solutions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-case-20-${{ matrix.batch_id }}
          path: result/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate all 2400 single-trip runs
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Excel dependency
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - uses: actions/download-artifact@v4
        with:
          pattern: hanoi-case-20-single-trip-batch*
          path: collected_results

      - name: Build consolidated ST workbook
        run: |
          python3 scripts/hanoi_case_study_33_cloud.py aggregate-single-trip \
            --input-root collected_results \
            --output hanoi_case_20_single_trip/hanoi_case_20_single_trip_results.xlsx

      - name: Upload consolidated ST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-case-20-single-trip-results
          path: hanoi_case_20_single_trip/
          if-no-files-found: warn
          retention-days: 90
