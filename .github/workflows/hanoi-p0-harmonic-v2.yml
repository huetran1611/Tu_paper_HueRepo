name: Hanoi 20 selected - P0 harmonic

on:
  push:
    branches:
      - test_hanoi
    paths:
      - .github/workflows/hanoi-p0-harmonic-v2.yml
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Maximum concurrent jobs (1 to 40)"
        required: true
        default: "20"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SPEED_PROFILE_ROOT: instance_hanoi/datasets/hanoi_traffic/experiment_speed_profiles
  # Use the same calibrated budget for P0, P1, and the P2 benchmark.
  MAX_ITERATIONS: "9000"
  SEGMENT_ITERATIONS: "100"
  TIME_LIMIT_SECONDS: "1200"

jobs:
  prepare:
    name: Validate data and build P0 solver
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate input and source data
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel || '20' }}
        run: |
          set -euo pipefail
          [[ "$MAX_PARALLEL" =~ ^[1-9][0-9]*$ ]]
          test "$MAX_PARALLEL" -le 40
          [[ "$MAX_ITERATIONS" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEGMENT_ITERATIONS" =~ ^[1-9][0-9]*$ ]]
          [[ "$TIME_LIMIT_SECONDS" =~ ^[1-9][0-9]*$ ]]
          python3 scripts/hanoi_case_study_33_cloud.py validate-data --profile-root "$SPEED_PROFILE_ROOT"
      - name: Build V2 Hanoi solver
        run: |
          mkdir -p build/hanoi_p0
          g++ -O3 -std=c++20 src_v2/tabubu_HanoiTraffic_v2.cpp -o build/hanoi_p0/tabubu_HanoiTraffic_v2
      - name: Build 50-job matrix (4 optimizations and 48 replays per job)
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/hanoi_case_study_33_cloud.py matrix --policy P0)"
          python3 -c 'import json,sys; m=json.loads(sys.argv[1]); assert len(m["include"])==50; assert all(j["task_count"]==4 and j["replay_count"]==48 for j in m["include"]); assert sum(j["task_count"] for j in m["include"])==200; assert sum(j["replay_count"] for j in m["include"])==2400' "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Smoke test harmonic P0 and realized replay
        run: |
          set -euo pipefail
          root="$PWD"
          work="$(mktemp -d)"
          python3 scripts/hanoi_case_study_33_cloud.py build-dataset-profiles \
            --profile-root "$SPEED_PROFILE_ROOT" --work-root "$work/profiles" \
            --dataset set_03 --aggregation harmonic
          speed="$work/profiles/set_03/P0.v_ijl_kph.txt"
          test "$(grep -vc '^#' "$speed")" -eq 122412
          stem="$root/instance_hanoi/datasets/hanoi_traffic/Hanoi_selected_20/set_03/hanoi_10x10_100_set_03_weekday"
          mkdir "$work/solve"
          cd "$work/solve"
          "$root/build/hanoi_p0/tabubu_HanoiTraffic_v2" "$stem.txt" \
            --truck-distance-file="$stem.truck_distance_m.txt" \
            --drone-distance-file="$stem.drone_distance_m.txt" --truck-vijl-file="$speed" \
            --start-hour=7 --attempts=1 --iters=2 --segment-iters=1 --time-limit=60 --seed=1
          test -s output_solution_best.txt
          mkdir replay
          cd replay
          set +e
          "$root/build/hanoi_p0/tabubu_HanoiTraffic_v2" "$stem.txt" \
            --truck-distance-file="$stem.truck_distance_m.txt" \
            --drone-distance-file="$stem.drone_distance_m.txt" \
            --truck-vijl-file="$work/profiles/set_03/weekday.v_ijl_kph.txt" \
            --start-hour=8 --evaluate-solution="$work/solve/output_solution_best.txt"
          status=$?
          set -e
          [[ "$status" == 0 || "$status" == 2 ]]
          test -s output_solution_evaluated.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hanoi-p0-harmonic-solver
          path: build/hanoi_p0/tabubu_HanoiTraffic_v2
          if-no-files-found: error
          retention-days: 2

  solve:
    name: ${{ matrix.batch_id }} | ${{ matrix.task_count }} optimize | ${{ matrix.replay_count }} replay
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '20') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hanoi-p0-harmonic-solver
          path: build/hanoi_p0
      - name: Optimize P0 and replay under actual traffic
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
        run: |
          set -euo pipefail
          chmod +x build/hanoi_p0/tabubu_HanoiTraffic_v2
          python3 scripts/hanoi_case_study_33_cloud.py run-batch \
            --binary build/hanoi_p0/tabubu_HanoiTraffic_v2 \
            --profile-root "$SPEED_PROFILE_ROOT" \
            --work-root "$RUNNER_TEMP/hanoi_p0_harmonic_profiles" \
            --aggregation harmonic --tasks-json "$TASKS_JSON" \
            --iterations "$MAX_ITERATIONS" --segment-iters "$SEGMENT_ITERATIONS" \
            --time-limit "$TIME_LIMIT_SECONDS" --output result
      - name: Upload logs, final solutions, and replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-p0-harmonic-${{ matrix.batch_id }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate P0 (200 optimizations and 2400 replays)
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Excel dependency
        run: python3 -m pip install --disable-pip-version-check openpyxl
      - uses: actions/download-artifact@v4
        with:
          pattern: hanoi-p0-harmonic-p0-batch*
          path: collected_results
      - name: Build P0 workbook and check completeness
        run: |
          python3 scripts/hanoi_case_study_33_cloud.py aggregate \
            --policy P0 --input-root collected_results \
            --output hanoi_p0/hanoi_20_p0_harmonic_results.xlsx
      - name: Upload P0 workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-p0-harmonic-results
          path: hanoi_p0/
          if-no-files-found: error
          retention-days: 90
