name: Hanoi P2 - 4 folds - 240 optimization jobs

on:
  push:
    paths:
      - .github/workflows/hanoi-p2-fourfold-sequential.yml
  workflow_dispatch:
    inputs:
      max_parallel:
        description: Maximum simultaneous optimization jobs (1 to 40)
        required: true
        default: '20'

permissions:
  contents: read

concurrency:
  group: hanoi-p2-fourfold-sequential
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    name: Validate 240 cases and build solver
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            scripts
            src_v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-hanoi-p2-pilot.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-hanoi-p2-pilot.txt
      - name: Validate concurrency and protocol
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel || '20' }}
        run: |
          [[ "$MAX_PARALLEL" =~ ^[1-9][0-9]*$ ]]
          test "$MAX_PARALLEL" -le 40
          python -m unittest discover -s scripts -p test_hanoi_p2_cloud_pilot.py
      - name: Build solver and clock regression test
        run: |
          mkdir -p build/hanoi_p2_cloud
          g++ -O3 -std=c++20 src_v2/tabubu_HanoiTraffic_v2.cpp -o build/hanoi_p2_cloud/solver
          g++ -O2 -std=c++20 scripts/test_hanoi_solver_clock.cpp -o build/hanoi_p2_cloud/test_clock
          build/hanoi_p2_cloud/test_clock
      - name: Create 240-job matrix
        id: matrix
        run: |
          matrix="$(python scripts/hanoi_p2_cloud_pilot.py matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hanoi-p2-fourfold-solver
          path: build/hanoi_p2_cloud/solver
          if-no-files-found: error
          retention-days: 2

  solve:
    name: ${{ matrix.task_key }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '20') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            scripts
            src_v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-hanoi-p2-pilot.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-hanoi-p2-pilot.txt
      - uses: actions/download-artifact@v4
        with:
          name: hanoi-p2-fourfold-solver
          path: build/hanoi_p2_cloud
      - name: Optimize one case and replay its held-out date
        env:
          TASK_KEY: ${{ matrix.task_key }}
        run: |
          chmod +x build/hanoi_p2_cloud/solver
          python -u scripts/hanoi_p2_cloud_pilot.py batch \
            --task-key "$TASK_KEY" --binary build/hanoi_p2_cloud/solver \
            --output result --profiles "$RUNNER_TEMP/p2-profiles"
      - name: Upload this case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-p2-fourfold-case-${{ matrix.task_key }}
          path: result/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate and verify all 240 cases
    needs: [prepare, solve]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            scripts
            src_v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-hanoi-p2-pilot.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-hanoi-p2-pilot.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: hanoi-p2-fourfold-case-*
          path: collected
      - name: Generate Excel and 17h report
        run: |
          python scripts/hanoi_p2_cloud_pilot.py aggregate \
            --input collected --output final_report
      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-p2-fourfold-final-report
          path: final_report/
          if-no-files-found: warn
          retention-days: 90
