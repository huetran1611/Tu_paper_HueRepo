name: Hanoi sensitivity - freshness and conservative static speed

on:
  workflow_dispatch:
    inputs:
      max_parallel_per_scale:
        description: "Concurrent solver jobs per scale (1-12; three scales run together)"
        required: true
        default: "12"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate parallelism
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel_per_scale }}
        run: |
          [[ "$MAX_PARALLEL" =~ ^[1-9][0-9]*$ ]]
          test "$MAX_PARALLEL" -le 12

  sensitivity:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        scale: ["0.8", "1.0", "1.2"]
    uses: ./.github/workflows/hanoi-sensitivity-worker-v2.yml
    with:
      freshness_scale: ${{ matrix.scale }}
      max_parallel: ${{ fromJSON(inputs.max_parallel_per_scale) }}

  aggregate_all:
    needs: sensitivity
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --disable-pip-version-check openpyxl
      - uses: actions/download-artifact@v4
        with:
          pattern: hanoi-sensitivity-*-sensitivity-batch*
          path: collected_results
      - name: Compare all freshness scales and policies
        run: |
          python3 scripts/hanoi_sensitivity.py aggregate --input-root collected_results \
            --output sensitivity_results/hanoi_sensitivity_all_scales.xlsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanoi-sensitivity-all-scales
          path: sensitivity_results/
          retention-days: 90
          if-no-files-found: warn
