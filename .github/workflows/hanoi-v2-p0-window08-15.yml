name: Hanoi V2 - P0 only - window 08 to 15
run-name: Hanoi V2 P0 [08,15) - start 08 - all 3200 optimizations

on:
  push:
    branches: [codex/hanoi-v2-p0-window08-15]
    paths: [.github/triggers/hanoi-v2-p0-window15]
  workflow_dispatch:
    inputs:
      max_parallel:
        description: Maximum concurrent shards (20 optimizations per shard)
        type: choice
        options: ['5', '10', '20', '40']
        default: '20'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: hanoi-v2-p0-window08-15-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLCONFIGDIR: /tmp/hanoi-v2-p0-window15-mpl

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/hanoi-v2/
            /scripts/hanoi_v2_experiment.py
            /scripts/hanoi_v2_p0_window15.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged pinned V2 requirements
        run: |
          python -m zipfile -e .github/hanoi-v2/inputs.zip "$RUNNER_TEMP/v2-bootstrap"
          python -m pip install -r "$RUNNER_TEMP/v2-bootstrap/runtime/scripts/requirements-hanoi-v2.txt"
      - name: Freeze a separate P0-only protocol and build 160 shards
        id: matrix
        run: |
          python scripts/hanoi_v2_p0_window15.py prepare \
            --capsule "$RUNNER_TEMP/p0-window15" \
            --experiment-id "p0-window15-$GITHUB_RUN_ID" --commit "$GITHUB_SHA" > "$RUNNER_TEMP/matrix-output.txt"
          tail -n 1 "$RUNNER_TEMP/matrix-output.txt" > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
          chmod +x "$RUNNER_TEMP/p0-window15/solver"
      - name: Verify all 20 instances, all folds and the exact harmonic formula
        run: |
          python scripts/hanoi_v2_p0_window15.py check --capsule "$RUNNER_TEMP/p0-window15"
      - name: Recompute start-08 S1 diagnostics (no P1 or P2 optimization)
        run: |
          python "$RUNNER_TEMP/p0-window15/runtime/scripts/hanoi_v2_experiment.py" s1 \
            --capsule "$RUNNER_TEMP/p0-window15" --output "$RUNNER_TEMP/p0-window15/S1"
          cat "$RUNNER_TEMP/p0-window15/batch_plan.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hanoi-v2-p0-window15-capsule
          path: ${{ runner.temp }}/p0-window15/
          retention-days: 90
          if-no-files-found: error

  optimize:
    needs: prepare
    name: P0 window15 shard ${{ matrix.shard }} of 160
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '20') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hanoi-v2-p0-window15-capsule
          path: ${{ runner.temp }}/p0-window15
      - name: Install unchanged pinned V2 requirements
        run: |
          python -m pip install -r "$RUNNER_TEMP/p0-window15/runtime/scripts/requirements-hanoi-v2.txt"
          chmod +x "$RUNNER_TEMP/p0-window15/solver"
      - name: Optimize 20 P0 tasks and replay each returned plan on three test dates
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -u "$RUNNER_TEMP/p0-window15/runtime/scripts/hanoi_v2_p0_window15.py" run-shard \
            --capsule "$RUNNER_TEMP/p0-window15" --shard "$SHARD" \
            --output "$GITHUB_WORKSPACE/results/p0-window15"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanoi-v2-p0-window15-shard-${{ matrix.shard }}
          path: results/p0-window15/
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    needs: [prepare, optimize]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hanoi-v2-p0-window15-capsule
          path: ${{ runner.temp }}/p0-window15
      - name: Install unchanged pinned V2 requirements
        run: python -m pip install -r "$RUNNER_TEMP/p0-window15/runtime/scripts/requirements-hanoi-v2.txt"
      - uses: actions/download-artifact@v4
        with:
          pattern: hanoi-v2-p0-window15-shard-*
          path: collected
      - name: Verify 3200 records and 9600 replay slots, then export isolated reports
        run: |
          python "$RUNNER_TEMP/p0-window15/runtime/scripts/hanoi_v2_p0_window15.py" aggregate \
            --capsule "$RUNNER_TEMP/p0-window15" --input collected \
            --output report
          cp -R "$RUNNER_TEMP/p0-window15/S1" report/S1
          cat report/coverage.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanoi-v2-p0-window15-report
          path: report/
          retention-days: 90
          if-no-files-found: warn
