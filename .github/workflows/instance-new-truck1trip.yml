name: Solve instance_new TD truck one-trip

on:
  workflow_dispatch:
    inputs:
      time_limit_sec:
        description: "Search time limit per instance in seconds; 0 means solver default/no explicit time limit"
        required: true
        default: "10800"
      attempts:
        description: "Number of attempts per instance"
        required: true
        default: "1"
      knn_k:
        description: "K nearest neighbors used by the search"
        required: true
        default: "1000"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build TD truck one-trip solver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build solver
        shell: msys2 {0}
        run: |
          g++ -O3 -std=c++20 -static -static-libgcc -static-libstdc++ tabubu_TimeDependent_new_instance_truck1trip.cpp -o tabubu_TimeDependent_new_instance_truck1trip.exe

      - name: Upload solver binary
        uses: actions/upload-artifact@v4
        with:
          name: truck1trip-solver
          path: tabubu_TimeDependent_new_instance_truck1trip.exe

  solve:
    name: Solve ${{ matrix.config }} / ${{ matrix.instance }}
    runs-on: windows-latest
    needs: build
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        config:
          - n50_1truck_1drone
          - n100_2truck_2drone
          - n200_3truck_3drone
          - n500_7truck_7drone
        instance:
          - instance001
          - instance002
          - instance003
          - instance004
          - instance005
          - instance006
          - instance007
          - instance008
          - instance009
          - instance010
    steps:
      - uses: actions/checkout@v5

      - name: Download solver binary
        uses: actions/download-artifact@v4
        with:
          name: truck1trip-solver
          path: .

      - name: Show job info
        shell: pwsh
        run: |
          Write-Host "Solve jobs: 4 configurations x 10 instances = 40"
          Write-Host "This job runs: ${{ matrix.config }} / ${{ matrix.instance }}"
          Write-Host "Truck model: time-dependent, one trip per truck"

      - name: Run TD truck one-trip model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $instDir = "${{ github.workspace }}\instance_new\${{ matrix.config }}\${{ matrix.instance }}"
          $logPath = Join-Path $instDir "truck1trip_solve_log.txt"
          $solutionPath = Join-Path $instDir "truck1trip_solution_best.txt"
          $iterationPath = Join-Path $instDir "truck1trip_iteration_mode_0.txt"
          Remove-Item -LiteralPath $logPath,$solutionPath,$iterationPath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "${{ github.workspace }}\output_solution_best.txt","${{ github.workspace }}\output_mode_0.txt" -Force -ErrorAction SilentlyContinue
          Push-Location "${{ github.workspace }}"
          try {
            $args = @(
              $instDir,
              "--attempts=${{ github.event.inputs.attempts }}",
              "--knn-k=${{ github.event.inputs.knn_k }}"
            )
            if ([int]"${{ github.event.inputs.time_limit_sec }}" -gt 0) {
              $args += "--time-limit=${{ github.event.inputs.time_limit_sec }}"
            }
            & "${{ github.workspace }}\tabubu_TimeDependent_new_instance_truck1trip.exe" @args *> $logPath
            if ($LASTEXITCODE -ne 0) { throw "TD truck one-trip solver failed with exit code $LASTEXITCODE" }
            Move-Item -LiteralPath "${{ github.workspace }}\output_solution_best.txt" -Destination $solutionPath -Force
            if (Test-Path -LiteralPath "${{ github.workspace }}\output_mode_0.txt") {
              Move-Item -LiteralPath "${{ github.workspace }}\output_mode_0.txt" -Destination $iterationPath -Force
            }
          } finally {
            Pop-Location
          }

      - name: Upload ${{ matrix.config }} ${{ matrix.instance }} results
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = "instance_new\${{ matrix.config }}\${{ matrix.instance }}"
          $bundleDir = "artifact-result\instance_new\${{ matrix.config }}\${{ matrix.instance }}"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $sourceDir "truck1trip_solution_best.txt") -Destination $bundleDir -Force
          Copy-Item -LiteralPath (Join-Path $sourceDir "truck1trip_solve_log.txt") -Destination $bundleDir -Force
          if (Test-Path -LiteralPath (Join-Path $sourceDir "truck1trip_iteration_mode_0.txt")) {
            Copy-Item -LiteralPath (Join-Path $sourceDir "truck1trip_iteration_mode_0.txt") -Destination $bundleDir -Force
          }

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: truck1trip-results-${{ matrix.config }}-${{ matrix.instance }}
          path: artifact-result/

  summarize:
    name: Summarize truck one-trip results
    runs-on: windows-latest
    needs: solve
    steps:
      - uses: actions/checkout@v5

      - name: Download all truck one-trip results
        uses: actions/download-artifact@v4
        with:
          pattern: truck1trip-results-*
          path: .
          merge-multiple: true

      - name: Generate truck one-trip summary
        shell: pwsh
        run: |
          python scripts\summarize_truck1trip_instance_new.py

      - name: Print summary
        shell: pwsh
        run: |
          $summary = "instance_new\truck1trip_summary_all_sets.csv"
          Import-Csv -LiteralPath $summary |
            Group-Object benchmark_set |
            ForEach-Object {
              $g = $_.Group
              [PSCustomObject]@{
                Set = $_.Name
                Count = $g.Count
                Infeasible = ($g | Where-Object { $_.rechecked_is_feasible -eq "NO" }).Count
                WaitingViolatedCustomers = ($g | Measure-Object waiting_violated_customer_count -Sum).Sum
                WaitingViolationMin = [Math]::Round((($g | Measure-Object waiting_violation_total_min -Sum).Sum), 6)
                MeanObjective = [Math]::Round((($g | Measure-Object truck1trip_objective -Average).Average), 6)
              }
            } | Format-Table -AutoSize
          Write-Host "Summary CSV: $summary"
          Write-Host "Waiting violation detail CSV: instance_new\truck1trip_waiting_violations_detail_all_sets.csv"
          Write-Host "Best solution files: instance_new\**\truck1trip_solution_best.txt"

      - name: Upload final truck one-trip summary
        uses: actions/upload-artifact@v4
        with:
          name: truck1trip-summary-all-sets
          path: |
            instance_new/truck1trip_summary_all_sets.csv
            instance_new/truck1trip_waiting_violations_detail_all_sets.csv
            instance_new/**/truck1trip_solution_best.txt
