name: V3 reset temperature after DR - 100 customers
run-name: V3 RESET after DR - 100 customers - resume - 20 solvers
on:
  workflow_dispatch:
    inputs:
      slots:
        description: JSON array of unfinished slots to run
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: v3-reset-100-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      slots: ${{ steps.matrix.outputs.slots }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/download_paper_bundle.py
            /scripts/v3_reset_experiment.py
            /experiments/v3_reset_100_expected.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse the validated, frozen reset bundle
        uses: actions/download-artifact@v4
        with:
          name: v3-reset-100-bundle
          path: bundle
          github-token: ${{ github.token }}
          run-id: 43730749202
      - name: Verify reused reset code
        run: |
          python - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('bundle/manifest.json').read_text())
          e=json.loads(Path('experiments/v3_reset_100_expected.json').read_text())
          assert hashlib.sha256(Path('bundle/source/solver.cpp').read_bytes()).hexdigest()==e['reset_source_sha256']
          assert m['temperature_policy']['reset_after_completed_dr']
          assert len(m['tasks'])==160
          assert json.loads(Path('bundle/control_validation.json').read_text())['matched_github_objective_and_routes']
          PYCODE
      - id: matrix
        env:
          REQUESTED_SLOTS: ${{ inputs.slots }}
        run: |
          python - <<'PY'
          import json,os
          slots=json.loads(os.environ['REQUESTED_SLOTS'])
          assert slots and len(slots)==len(set(slots)) and all(type(s) is int and 0<=s<160 for s in slots)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('slots='+json.dumps(slots,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-reset-100-bundle
          path: bundle/
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-reset-100-control
          path: |
            control_validation.json
            control_results/**/completed.json
            control_results/**/output_solution_best.txt
          retention-days: 30
          if-no-files-found: warn
  solve:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slot: ${{ fromJSON(needs.prepare.outputs.slots) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/v3_reset_experiment.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v3-reset-100-bundle
          path: bundle
      - name: Run one 100-customer seed with DR and SA
        run: |
          chmod +x bundle/solver
          python -u scripts/v3_reset_experiment.py task --bundle bundle --slot '${{ matrix.slot }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-reset-100-s${{ matrix.slot }}
          path: |
            results/**/completed.json
            results/**/request.json
            results/**/output_solution_best.txt
          retention-days: 30
          if-no-files-found: warn
