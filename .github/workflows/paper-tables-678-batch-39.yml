name: V3 reset temperature after DR - 100 customers
run-name: V3 RESET after DR - 100 customers - 10 seeds - DR+SA
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v3-reset-100-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      slots: ${{ steps.matrix.outputs.slots }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/download_paper_bundle.py
            /scripts/v3_reset_experiment.py
            /experiments/v3_reset_100_expected.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original frozen T678 bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/download_paper_bundle.py --repo "$GITHUB_REPOSITORY" --setup-run-id 43077064461
      - name: Verify original control against GitHub and prepare reset solver
        run: python -u scripts/v3_reset_experiment.py prepare --bundle bundle --expected experiments/v3_reset_100_expected.json
      - id: matrix
        run: |
          python - <<'PY'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('slots='+json.dumps(list(range(160)),separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-reset-100-bundle
          path: bundle/
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-reset-100-control
          path: |
            control_validation.json
            control_results/**/completed.json
            control_results/**/output_solution_best.txt
          retention-days: 30
          if-no-files-found: warn
  solve:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slot: ${{ fromJSON(needs.prepare.outputs.slots) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/v3_reset_experiment.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v3-reset-100-bundle
          path: bundle
      - name: Run one 100-customer seed with DR and SA
        run: |
          chmod +x bundle/solver
          python -u scripts/v3_reset_experiment.py task --bundle bundle --slot '${{ matrix.slot }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-reset-100-s${{ matrix.slot }}
          path: |
            results/**/completed.json
            results/**/request.json
            results/**/output_solution_best.txt
          retention-days: 30
          if-no-files-found: warn
