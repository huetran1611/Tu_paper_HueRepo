name: Resume failed 200-customer jobs from two runs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GROUP_1_RUN_ID: "28310990837"
  GROUP_2_RUN_ID: "28310990818"
  PRIOR_RESUME_RUN_ID: "28364577147"
  SOLVER_TIME_LIMIT_SEC: "18000"

jobs:
  prepare:
    name: Recover existing results and build missing-job matrix
    runs-on: ubuntu-latest
    outputs:
      resume_matrix: ${{ steps.matrix.outputs.matrix }}
      resume_count: ${{ steps.matrix.outputs.count }}
      recovered_count: ${{ steps.matrix.outputs.recovered_count }}
    steps:
      - uses: actions/checkout@v5

      - name: Download successful group-1 results from old run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.GROUP_1_RUN_ID }}
          pattern: neighborhood-200-group-1-200.*
          path: recovered_sources
          merge-multiple: true

      - name: Download successful group-2 results from old run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.GROUP_2_RUN_ID }}
          pattern: neighborhood-200-group-2-200.*
          path: recovered_sources
          merge-multiple: true

      - name: Download results from the previous resume run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.PRIOR_RESUME_RUN_ID }}
          pattern: neighborhood-200-resumed-*
          path: recovered_sources
          merge-multiple: true

      - name: Compile solver from current code
        run: |
          g++ -O2 -std=c++20 tabubu_TimeDependent_neighbourhoddSelection.cpp \
            -o tabubu_neighborhood_200_resume_two_runs

      - name: Build matrix from configurations still missing
        id: matrix
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          from pathlib import Path

          gamma = {
              "g1": [0.3, 0.2, 0.1, 0.3],
              "g2": [0.5, 0.3, 0.1, 0.3],
              "g3": [0.3, 0.2, 0.1, 0.6],
              "g4": [0.5, 0.3, 0.1, 0.6],
          }
          methods = [
              {"strategy": "cyclic"},
              {"strategy": "random"},
              {"strategy": "adaptive", "gamma_set": "g1", "gamma": gamma["g1"]},
              {"strategy": "adaptive", "gamma_set": "g2", "gamma": gamma["g2"]},
              {"strategy": "adaptive", "gamma_set": "g3", "gamma": gamma["g3"]},
              {"strategy": "adaptive", "gamma_set": "g4", "gamma": gamma["g4"]},
          ]
          instances = [
              f"200.{drone_customers}.{variant}"
              for drone_customers in (10, 20, 30, 40)
              for variant in (1, 2, 3, 4)
          ]

          def result_name(task):
              suffix = f"_strategy_{task['strategy']}"
              if task["strategy"] == "adaptive":
                  suffix += f"_gamma_{task['gamma_set']}"
              return f"{task['instance']}_run_{task['repetition']}{suffix}.txt"

          existing = {
              path.name
              for path in Path("recovered_sources").rglob("*_run_*.txt")
              if path.is_file()
          }
          expected_tasks = [
              {"instance": instance, "repetition": repetition, **method}
              for instance in instances
              for method in methods
              for repetition in range(1, 6)
          ]
          missing_tasks = [
              task for task in expected_tasks
              if result_name(task) not in existing
          ]
          if len(missing_tasks) > 256:
              raise SystemExit(f"Missing matrix has {len(missing_tasks)} jobs, exceeding GitHub's 256-job limit")

          matrix = []
          for task in missing_tasks:
              task_id = f"{task['instance']}-run-{task['repetition']}-{task['strategy']}"
              if task["strategy"] == "adaptive":
                  task_id += f"-{task['gamma_set']}"
              matrix.append({
                  "task_id": task_id,
                  "tasks_json": json.dumps([task], separators=(",", ":")),
              })

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"count={len(matrix)}\n")
              output.write(f"recovered_count={len(existing)}\n")
          print(f"Recovered {len(existing)} existing configurations")
          print(f"Prepared {len(matrix)} missing configurations to rerun")
          PYEOF

      - name: Upload recovered source results
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-200-recovered-before-final-resume
          path: recovered_sources/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload resume solver
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-200-two-runs-resume-solver
          path: tabubu_neighborhood_200_resume_two_runs
          retention-days: 1

  solve-failed:
    name: ${{ matrix.task_id }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.resume_matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: neighborhood-200-two-runs-resume-solver

      - name: Run failed configuration with current code
        shell: bash
        run: |
          chmod +x tabubu_neighborhood_200_resume_two_runs
          mkdir -p resumed_results
          cat > task.json <<'JSONEOF'
          ${{ matrix.tasks_json }}
          JSONEOF
          python3 scripts/run_neighborhood_batch.py \
            ./tabubu_neighborhood_200_resume_two_runs \
            task.json \
            resumed_results

      - name: Upload resumed configuration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-200-resumed-${{ matrix.task_id }}
          path: resumed_results/*.txt
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Merge two old runs plus resumed run
    needs: [prepare, solve-failed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download recovered old and prior-resume results
        uses: actions/download-artifact@v4
        with:
          name: neighborhood-200-recovered-before-final-resume
          path: recovered_results
          merge-multiple: true

      - name: Download newly resumed results from this run
        uses: actions/download-artifact@v4
        with:
          pattern: neighborhood-200-resumed-*
          path: resumed_results
          merge-multiple: true

      - name: Combine result files, preferring resumed outputs
        run: |
          python3 - <<'PYEOF'
          import shutil
          from pathlib import Path

          combined = Path("combined_results")
          combined.mkdir(exist_ok=True)
          sources = [
              Path("recovered_results"),
              Path("resumed_results"),
          ]
          copied = 0
          for source in sources:
              for path in sorted(source.rglob("*_run_*.txt")):
                  target = combined / path.name
                  shutil.copy2(path, target)
                  copied += 1
          unique_count = len(list(combined.glob("*_run_*.txt")))
          print(f"Copied {copied} result files into {unique_count} unique result files")
          PYEOF

      - name: Create complete Excel workbook and CSV
        run: |
          python3 scripts/aggregate_cyclic_results.py \
            combined_results \
            neighborhood_selection_200_two_runs_complete.xlsx \
            --csv neighborhood_selection_200_two_runs_complete.csv

      - name: Verify complete 480-configuration result set
        run: |
          python3 - <<'PYEOF'
          import csv
          from collections import Counter

          with open("neighborhood_selection_200_two_runs_complete.csv", newline="", encoding="utf-8") as csv_file:
              rows = list(csv.DictReader(csv_file))

          keys = {
              (row["Instance"], row["Strategy"], row["Gamma set"], row["Repetition"])
              for row in rows
          }
          actual = Counter(
              row["Strategy"] if row["Strategy"] != "adaptive"
              else f'adaptive-{row["Gamma set"]}'
              for row in rows
          )
          expected = Counter({
              "cyclic": 80,
              "random": 80,
              "adaptive-g1": 80,
              "adaptive-g2": 80,
              "adaptive-g3": 80,
              "adaptive-g4": 80,
          })
          if len(rows) != 480 or len(keys) != 480 or actual != expected:
              raise SystemExit(
                  f"Expected 480 unique rows and {expected}; "
                  f"found {len(rows)} rows, {len(keys)} unique keys, and {actual}"
              )
          print("Verified complete 480-configuration result set")
          PYEOF

      - name: Upload complete merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-selection-200-two-runs-complete-results
          path: |
            neighborhood_selection_200_two_runs_complete.xlsx
            neighborhood_selection_200_two_runs_complete.csv
            combined_results/*.txt
          if-no-files-found: warn
          retention-days: 90
