name: Workload tie-breaking - batch 4 - 210 independent processes
run-name: Workload ablation 4/4 - 210 jobs - 5 seeds - capacities 40 and 2.27
on:
  push:
    branches: [codex/workload-tiebreak-5seeds]
    paths: [.github/triggers/workload-tiebreak-batches]
  workflow_dispatch:
    inputs:
      setup_run_id:
        description: Successful updated setup run ID, or latest
        type: string
        default: latest
permissions:
  contents: read
  actions: read
concurrency:
  group: workload-tiebreak-batch-4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  batch:
    uses: ./.github/workflows/workload-tiebreak-single-batch.yml
    with:
      setup_run_id: ${{ inputs.setup_run_id || 'latest' }}
      batch: 4
