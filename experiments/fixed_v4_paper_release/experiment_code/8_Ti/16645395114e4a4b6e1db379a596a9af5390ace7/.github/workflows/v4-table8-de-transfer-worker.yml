name: V4 Table 8 D/E transfer worker
on:
  workflow_call:
    inputs:
      batch:
        type: number
        required: true
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      parallel: ${{ steps.plan.outputs.parallel }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/v4-table8-de-baseline.json
            /.github/v4-table8-irace.json
            /.github/workload-tiebreak/
            /scripts/
            /src_v4/*.cpp
            /src_v4/*.hpp
      - id: plan
        name: Freeze V4 solver and inputs for one batch
        env:
          BATCH: ${{ inputs.batch }}
        run: python3 scripts/v4_table8_de_transfer.py prepare --batch "$BATCH" --bundle bundle --runtime runtime
      - uses: actions/upload-artifact@v4
        with:
          name: v4-table8-runtime
          path: runtime/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  solve:
    name: Solve slot ${{ matrix.slot }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v4-table8-runtime
          path: runtime
      - name: Run exactly one solver process
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          chmod +x runtime/solver
          python3 runtime/v4_table8_actions.py solve --runtime runtime --slot "$SLOT" --output result
      - uses: actions/upload-artifact@v4
        with:
          name: v4-table8-slot-${{ matrix.slot }}
          path: result/slot-${{ matrix.slot }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v4-table8-error-${{ matrix.slot }}-${{ github.run_attempt }}
          path: |
            result/stderr.log
            result/result.json
          if-no-files-found: ignore
          retention-days: 7

  pack:
    name: Publish one result artifact for this batch
    needs: [prepare, solve]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v4-table8-runtime
          path: runtime
      - uses: actions/download-artifact@v4
        with:
          pattern: v4-table8-slot-*
          merge-multiple: true
          path: records
      - run: python3 runtime/v4_table8_actions.py pack --runtime runtime --records records --output packed.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-table8-packed-${{ github.run_attempt }}
          path: packed.json
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Collect all completed D/E batches
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
    concurrency:
      group: v4-table8-de-transfer-report-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v4-table8-runtime
          path: runtime
      - name: Produce the combined report when all packs are ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u runtime/v4_table8_de_transfer.py collect --runtime runtime --output report
      - uses: actions/upload-artifact@v4
        with:
          name: v4-table8-de-report
          path: report/
          if-no-files-found: ignore
          retention-days: 30
